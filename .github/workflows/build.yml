name: anynines平台

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */25 * *' # 每 25 天凌晨 3 点自动重新构建一次，防止平台清理

env:
  CF_API: "https://api.de.a9s.eu"
  CF_USER: ${{ secrets.CF_USER }}  #  邮箱
  CF_PASS: ${{ secrets.CF_PASS }}  #  密码

jobs:
  deploy:
    name: anynines平台
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli

      - name: Deploy (with cleanup)
        run: |
          cf api "$CF_API"
          cf auth "$CF_USER" "$CF_PASS"

          # 定位组织和空间
          ORG=$(cf orgs | awk 'NR>3 {print $1; exit}')
          cf target -o "$ORG"
          SPACE=$(cf spaces | awk 'NR>3 {print $1; exit}')
          if [ -z "$SPACE" ]; then
            cf create-space dev
            SPACE="dev"
          fi
          cf target -o "$ORG" -s "$SPACE"

          # ---------- 清理旧应用 + 孤儿路由 ----------
          echo "Cleaning up old apps..."
          APPS=$(cf apps | awk 'NR>3 {print $1}')
          if [ -n "$APPS" ]; then
            for APP in $APPS; do
              echo "Deleting app: $APP"
              cf delete "$APP" -f
            done
          fi
          cf delete-orphaned-routes -f

          # ---------- 推送新应用 ----------
          cf push --strategy rolling

          APP_NAME="lz-web"
          ROUTE=$(cf app "$APP_NAME" | awk '/^routes:/{print $2}')
          if [ -z "$ROUTE" ]; then
            echo "Failed to get route"
            exit 1
          fi
          if [[ ! "$ROUTE" =~ ^https?:// ]]; then
            ROUTE="https://$ROUTE"
          fi
          echo "Detected route: $ROUTE"

          # 设置环境变量 DOMAIN（去掉协议和路径）
          DOMAIN_VALUE=$(echo "$ROUTE" | sed -e 's|https://||' -e 's|http://||' -e 's|/.*||')
          cf set-env "$APP_NAME" DOMAIN "$DOMAIN_VALUE"
          echo "DOMAIN set to: $DOMAIN_VALUE"

          # 重启应用使环境变量生效
          cf restart "$APP_NAME"

          # ---------- 自动同步新订阅地址到 Cloudflare Worker KV ----------
          NEW_SUB_URL="https://${DOMAIN_VALUE}/sub"
          echo "Syncing new subscription URL to Cloudflare KV: $NEW_SUB_URL"

          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/SUB_URL" \
            -H "X-Auth-Email: ${{ secrets.CF_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CF_GLOBAL_KEY }}" \
            -H "Content-Type: text/plain" \
            --data "$NEW_SUB_URL"

          echo "Cloudflare KV subscription updated successfully!"
