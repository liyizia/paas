name: anynines平台

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */25 * *' # 每 25 天凌晨 3 点自动重新构建一次，防止平台清理

env:
  CF_API: "https://api.de.a9s.eu"
  CF_USER: ${{ secrets.CF_USER }}  # 邮箱
  CF_PASS: ${{ secrets.CF_PASS }}  # 密码

jobs:
  deploy:
    name: anynines平台
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cloudfoundry.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Deploy
        run: |
          cf api "$CF_API"
          cf auth "$CF_USER" "$CF_PASS"

          # 定位组织和空间
          ORG=$(cf orgs | awk 'NR>3 {print $1; exit}')
          cf target -o "$ORG"
          SPACE=$(cf spaces | awk 'NR>3 {print $1; exit}')
          if [ -z "$SPACE" ]; then
            cf create-space dev
            SPACE="dev"
          fi
          cf target -o "$ORG" -s "$SPACE"

          # 清理旧应用并重新推送，自动绑定固定域名 lz-ws-node.de.a9sapp.eu
          cf delete lz-web -f -r || true
          cf push
